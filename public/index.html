<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Trao AI Interview Prep Kit API</title>
  <style>
    body {

      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;

      background: #1e293b;

      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);

    h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #064e3b;
      color: #34d399;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { text-decoration: underline; }

  <div class="card">
